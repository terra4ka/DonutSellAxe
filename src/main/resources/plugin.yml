name: DonutSellAxe
version: 1.0.0
main: com.donutsellaxe.DonutSellAxe
api-version: '1.20'
depend: [Vault]
authors: [terra]
description: DonutSMP-style Sell Axe with 7d self-destruct timer and instant chest respawn
commands:
  sellaxe:
    description: Give or reload DonutSellAxe
    aliases: [saxe, donutsellaxe]
    permission: donutsellaxe.admin
permissions:
  donutsellaxe.admin:
    description: Allows giving sell axes and reloading the plugin
    default: op
  donutsellaxe.use:
    description: Allows using the sell axe to sell containers
    default: true
